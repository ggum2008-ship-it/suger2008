name: 오늘의 이슈 쇼츠 (매일)

on:
  schedule:            # GitHub 예약은 붐비는 정각·30분에 자주 빠져서, 한산한 시각에 여러 번 걸어 둔다. 이미 보낸 날은 자동으로 건너뜀
    - cron: "17 20 * * *"   # 한국 시간 5시 17분
    - cron: "47 20 * * *"   # 한국 시간 5시 47분
    - cron: "23 21 * * *"   # 한국 시간 6시 23분
    - cron: "53 21 * * *"   # 한국 시간 6시 53분
    - cron: "37 22 * * *"   # 한국 시간 7시 37분
    - cron: "19 23 * * *"   # 한국 시간 8시 19분
  workflow_dispatch:            # 'Run workflow' 버튼으로 지금 바로 실행
    inputs:
      test:
        description: "시험 모드 (API 비용 없이 예시 영상으로 메일만 확인)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: issue-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 영상 도구와 한글 글꼴 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-noto-cjk-extra
          pip install -q -r requirements.txt

      - name: 오늘의 이슈 만들고 메일 보내기
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          USE_SAMPLE: ${{ inputs.test && '1' || '0' }}
        run: python agent.py daily

      - name: 다룬 이슈 기록 저장
        if: ${{ !inputs.test }}
        run: |
          git config user.name "issue-agent"
          git config user.email "issue-agent@users.noreply.github.com"
          git add history.json
          if ! git diff --cached --quiet; then
            git commit -m "기록: $(date +%F) 오늘의 이슈"
            git pull --rebase -q
            git push
          fi
